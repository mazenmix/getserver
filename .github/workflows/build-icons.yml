name: Build MX GetServer icons
on:
  workflow_dispatch:
  push:
    paths:
      - "assets/mx-getserver-icon.svg"
      - "scripts/build_icons.py"
      - ".github/workflows/build-icons.yml"

permissions:
  contents: write

concurrency:
  group: build-getserver-icons
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate icon PNGs and ICO
        run: python scripts/build_icons.py
      - name: Commit generated icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.ico favicon.png apple-touch-icon.png icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish MX GetServer favicon and install icons"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Generated icon assets are unchanged."
          fi
